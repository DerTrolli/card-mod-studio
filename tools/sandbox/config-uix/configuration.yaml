homeassistant:
  name: Sandbox
  latitude: 0
  longitude: 0
  elevation: 0
  unit_system: metric
  time_zone: UTC
  country: US
  currency: USD

# The demo integration auto-creates a broad set of entities (lights with rgb,
# sensors, climate, covers, media players, fans, etc.) — our test fixtures.
demo:

frontend:
  themes:
    # A translucent "glass" theme like the ones in the wild (issue #36):
    # see-through card and dialog surfaces. The Studio must stay readable on
    # it — nothing of HA's own editor may show through the panel.
    Glass QA:
      modes:
        dark:
          card-background-color: "rgba(40, 40, 40, 0.35)"
          ha-card-background: "rgba(40, 40, 40, 0.35)"
          ha-card-backdrop-filter: "blur(12px)"
          ha-dialog-surface-background: "rgba(20, 20, 20, 0.45)"
          mdc-theme-surface: "rgba(20, 20, 20, 0.45)"
          ha-dialog-surface-backdrop-filter: "blur(16px)"
          primary-background-color: "rgba(10, 10, 10, 0.3)"
          secondary-background-color: "rgba(255, 255, 255, 0.06)"
        light:
          card-background-color: "rgba(255, 255, 255, 0.4)"
          ha-card-background: "rgba(255, 255, 255, 0.4)"
          ha-card-backdrop-filter: "blur(12px)"
          ha-dialog-surface-background: "rgba(250, 250, 250, 0.5)"
          mdc-theme-surface: "rgba(250, 250, 250, 0.5)"
          ha-dialog-surface-backdrop-filter: "blur(16px)"
          primary-background-color: "rgba(240, 240, 240, 0.35)"
          secondary-background-color: "rgba(0, 0, 0, 0.04)"

# recorder+history so graph-bearing cards (sensor footer graph,
# history-graph) actually render chart internals — on HA 2026.8+ they
# render NOTHING without history data (2026.7 still drew a placeholder).
recorder:
history:
logbook:


# YAML-mode dashboard so we never touch the storage/editor onboarding. HA
# re-reads ui-lovelace.yaml on every page load, which the harness relies on.
#
# No card-mod.js resource here (unlike ../config/configuration.yaml): UIX's
# own config flow (custom_components/uix/config_flow.py, checked via
# check_card_mod_frontend_script_resource) aborts setup with
# "old_frontend_script_resource" if it finds a Lovelace resource URL
# containing the substring "card-mod.js" — so this sandbox is UIX-only by
# necessity, run as a separate HA instance from ../config. See
# tools/sandbox/README.md.
lovelace:
  mode: yaml
  resources:
    - url: /local/card-mod-studio.js
      type: module
